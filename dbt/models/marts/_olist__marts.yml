models:
  - name: dim_products
    description: "One row per product, containing product attributes and optional English category translations"
    columns:
      - name: product_id
        description: "Unique identifier for each product"
        data_tests:
          - not_null
          - unique

      - name: product_category_name
        description: "Original Portuguese product category, nullable when missing from the source"

      - name: product_category_name_english
        description: "English category translation, nullable when the original category is missing or no translation exists"

      - name: product_name_length
        description: "Length of the product name in characters"

      - name: product_description_length
        description: "Length of the product description in characters"

      - name: product_photos_quantity
        description: "Number of product photos"

      - name: product_weight_g
        description: "Product weight in grams"

      - name: product_length_cm
        description: "Product length in centimeters"

      - name: product_height_cm
        description: "Product height in centimeters"

      - name: product_width_cm
        description: "Product width in centimeters"

  - name: fact_order_items
    description: "One row per order line item, containing product and seller references, shipping deadline and monetary measures"
    data_tests:
      - olist_analytics.unique_combination_of_columns:
          arguments:
            columns:
              - order_id
              - order_item_id

    columns:
      - name: order_id
        description: "Identifier of the order containing the line item"
        data_tests:
          - not_null

      - name: order_item_id
        description: "Identifier of the line item within an order"
        data_tests:
          - not_null

      - name: product_id
        description: "Identifier of the product associated with the line item"
        data_tests:
          - relationships:
              arguments:
                to: "{{ ref ('dim_products') }}"
                field: product_id

      - name: seller_id
        description: "Identifier of the seller responsible for the line item"

      - name: shipping_limit_date
        description: "Deadline for the seller to hand over the item for shipping"

      - name: price
        description: "Price of the individual order line item"

      - name: freight_value
        description: "Freight charge associated with the individual order line item"