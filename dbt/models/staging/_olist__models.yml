models:
  - name: stg_olist__orders
    description: "One row per order. Standardizes raw Olist order data"
    columns:
      - name: order_id
        description: "Unique identifier per order"
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: "order-specific customer identifier"
        data_tests:
          - unique
          - not_null

      - name: order_status
        description: "The status of one order"
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - shipped
                  - unavailable
                  - invoiced
                  - created
                  - approved
                  - processing
                  - delivered
                  - canceled

      - name: purchased_at
        description: "Timestamp when the customer placed the order"
        data_tests:
          - not_null

      - name: payment_approved_at
        description: "Timestamp when the order's payment was approved"

      - name: delivered_to_carrier_at
        description: "Timestamp when the order was handed over to the carrier"

      - name: delivered_to_customer_at
        description: "Timestamp when the order was delivered to the customer"

      - name: estimated_delivery_date
        description: "Estimated calendar date of customer delivery"
        data_tests:
          - not_null

  - name: stg_olist__customers
    description: "One row per order-specific customer record. Standardizes the postal-code prefix as five-digit text, restoring leading zeros lost during raw ingestion"
    columns:
      - name: customer_unique_id
        description: "Stable customer identifier that can appear across multiple orders"
        data_tests:
          - not_null

      - name: customer_zip_code_prefix
        description: "Five-digit postal-code prefix associated with the customer's address. Stored as text to preserve leading zeros"
        data_tests:
          - not_null

      - name: customer_id
        description: "Order-specific customer identifier"
        data_tests:
          - unique
          - not_null

      - name: customer_city
        description: "City associated with the customer's address"
        data_tests:
          - not_null

      - name: customer_state
        description: "Brazilian state code associated with the customer's address"
        data_tests:
          - not_null

  - name: stg_olist__sellers
    description: "One row per seller. Standardizes the postal-code prefix as five-digit text, restoring leading zeros lost during raw ingestion"
    columns:
      - name: seller_id
        description: "Unique identifier assigned to each seller"
        data_tests:
          - unique
          - not_null

      - name: seller_zip_code_prefix
        description: "Five-digit postal-code prefix associated with the seller. Stored as text to preserve leading zeros"
        data_tests:
          - not_null

      - name: seller_city
        description: "City associated with the seller"
        data_tests:
          - not_null

      - name: seller_state
        description: "Brazilian state code associated with the seller's address"
        data_tests:
          - not_null

  - name: stg_olist__order_items
    description: "One row per item entry into an order"
    data_tests:
      - unique_combination_of_columns:
          arguments:
            columns:
              - order_id
              - order_item_id
    columns:
      - name: order_id
        description: "Identifier of the order containing this item. Can repeat because an order may contain multiple items"
        data_tests:
          - not_null

      - name: order_item_id
        description: "item's sequence identifier within an order"
        data_tests:
          - not_null

      - name: product_id
        description: "Describes a product within an order, but it can be seen in many different orders"
        data_tests:
          - not_null

      - name: seller_id
        description: "Describes a seller within an order, but it can be seen in many different orders"
        data_tests:
          - not_null

      - name: shipping_limit_date
        description: "Represents the seller's deadline for handing the item over to the logistics partner"
        data_tests:
          - not_null

      - name: price
        description: "Price of the order item, excluding shipping costs"
        data_tests:
          - not_null

      - name: freight_value
        description: "Shipping cost allocated to the order item"
        data_tests:
          - not_null

  - name: stg_olist__order_payments
    description: "one row per payment sequence within an order"
    data_tests:
      - unique_combination_of_columns:
          arguments:
            columns:
              - order_id
              - payment_sequential

    columns:
      - name: order_id
        description: "Identifier of the order associated with this payment"
        data_tests:
          - not_null

      - name: payment_sequential
        description: "Sequence number identifying a payment entry within an order"
        data_tests:
          - not_null

      - name: payment_type
        description: "Payment method used for this payment entry"
        data_tests:
          - not_null

      - name: payment_installments
        description: "Number of installments recorded for this payment."
        data_tests:
          - not_null

      - name: payment_value
        description: "Monetary amount associated with this payment entry."
        data_tests:
          - not_null

  - name: stg_olist__products
    description: "One row per product. Converts blank or whitespace-only category names to SQL NULL and preserves other nullable product attributes."
    columns:

      - name: product_id
        description: "Unique identifier for each product"
        data_tests:
          - unique
          - not_null

      - name: product_category_name
        description: "Category assigned to the product. Empty and whitespace-only source values are converted to SQL NULL"

      - name: product_name_length
        description: "Length of the product name in characters"

      - name: product_description_length
        description: "Length of the product description in characters"

      - name: product_photos_quantity
        description: "Number of photos associated with the product"

      - name: product_weight_g
        description: "Product weight in grams"

      - name: product_length_cm
        description: "Product length in centimeters"

      - name: product_height_cm
        description: "Product height in centimeters"

      - name: product_width_cm
        description: "Product width in centimeters"

  - name: stg_olist__order_reviews
    description: "One row per review and order combination, preserving review scores, optional comments and timestamps"
    data_tests:
      - unique_combination_of_columns:
          arguments:
            columns:
              - review_id
              - order_id
    columns:

      - name: review_id
        description: "Identifier of the review"
        data_tests:
          - not_null

      - name: order_id
        description: "Identifier of the associated order"
        data_tests:
          - not_null

      - name: review_score
        description: "Customer review score from 1 to 5"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]

      - name: review_comment_title
        description: "Optional review title, with blank or whitespace-only values converted to sql null"

      - name: review_comment_message
        description: "Optional review comment, with blank or whitespace-only values converted to sql null"

      - name: review_created_at
        description: "Timestamp recorded for review creation"

      - name: review_answered_at
        description: "Timestamp recorded for the review answer"

  - name: stg_olist__product_category_translations
    description: "One row per Portuguese product category with its English translation"
    columns:

      - name: product_category_name
        description: "Portuguese product category name used as the translation lookup key"
        data_tests:
          - unique
          - not_null

      - name: product_category_name_english
        description: "English translation of the Portuguese product category name"
        data_tests:
          - not_null

  - name: stg_olist__geolocation
    description: "One row per geolocation observation, preserving repeated ZIP prefixes and imported coordinate values"
    columns:

      - name: geolocation_zip_code_prefix
        description: "Five-digit ZIP code prefix standardized as text with leading zeros preserved"
        data_tests:
          - not_null

      - name: geolocation_lat
        description: "Latitude of the geolocation observation, retaining imported float4 precision"
        data_tests:
          - not_null

      - name: geolocation_lng
        description: "Longitude of the geolocation observation, retaining imported float4 precision"
        data_tests:
          - not_null

      - name: geolocation_city
        description: "City associated with the geolocation observation"
        data_tests:
          - not_null

      - name: geolocation_state
        description: "State associated with the geolocation observation"
        data_tests:
          - not_null