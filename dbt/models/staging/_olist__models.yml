models:
  - name: stg_olist__orders
    description: "One row per order. Standardizes raw Olist order data"
    columns:
      - name: order_id
        description: "Unique identifier per order"
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: "order-specific customer identifier"
        data_tests:
          - unique
          - not_null

      - name: order_status
        description: "The status of one order"
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - shipped
                  - unavailable
                  - invoiced
                  - created
                  - approved
                  - processing
                  - delivered
                  - canceled

      - name: purchased_at
        description: "Timestamp when the customer placed the order"
        data_tests:
          - not_null

      - name: payment_approved_at
        description: "Timestamp when the order's payment was approved"

      - name: delivered_to_carrier_at
        description: "Timestamp when the order was handed over to the carrier"

      - name: delivered_to_customer_at
        description: "Timestamp when the order was delivered to the customer"

      - name: estimated_delivery_date
        description: "Estimated calendar date of customer delivery"
        data_tests:
          - not_null

  - name: stg_olist__customers
    description: "One row per order-specific customer record. Standardizes the postal-code prefix as five-digit text, restoring leading zeros lost during raw ingestion"
    columns:
      - name: customer_unique_id
        description: "Stable customer identifier that can appear across multiple orders"
        data_tests:
          - not_null

      - name: customer_zip_code_prefix
        description: "Five-digit postal-code prefix associated with the customer's address. Stored as text to preserve leading zeros"
        data_tests:
          - not_null

      - name: customer_id
        description: "Order-specific customer identifier"
        data_tests:
          - unique
          - not_null

      - name: customer_city
        description: "City associated with the customer's address"
        data_tests:
          - not_null

      - name: customer_state
        description: "Brazilian state code associated with the customer's address"
        data_tests:
          - not_null

  - name: stg_olist__sellers
    description: "One row per seller. Standardizes the postal-code prefix as five-digit text, restoring leading zeros lost during raw ingestion"
    columns:
      - name: seller_id
        description: "Unique identifier assigned to each seller."
        data_tests:
          - unique
          - not_null

      - name: seller_zip_code_prefix
        description: "Five-digit postal-code prefix associated with the seller. Stored as text to preserve leading zeros"
        data_tests:
          - not_null

      - name: seller_city
        description: "City associated with the seller"
        data_tests:
          - not_null

      - name: seller_state
        description: "Brazilian state code associated with the seller's address"
        data_tests:
          - not_null

  - name: stg_olist__order_items
    description: "One row per item entry into an order."
    data_tests:
      - unique_combination_of_columns:
          arguments:
            columns:
              - order_id
              - order_item_id
    columns:
      - name: order_id
        description: "Identifier of the order containing this item. Can repeat because an order may contain multiple items."
        data_tests:
          - not_null

      - name: order_item_id
        description: "item's sequence identifier within an order"
        data_tests:
          - not_null

      - name: product_id
        description: "Describes a product within an order, but it can be seen in many different orders"
        data_tests:
          - not_null

      - name: seller_id
        description: "Describes a seller within an order, but it can be seen in many different orders"
        data_tests:
          - not_null

      - name: shipping_limit_date
        description: "Represents the seller's deadline for handing the item over to the logistics partner"
        data_tests:
          - not_null

      - name: price
        description: "Price of the order item, excluding shipping costs."
        data_tests:
          - not_null

      - name: freight_value
        description: "Shipping cost allocated to the order item."
        data_tests:
          - not_null